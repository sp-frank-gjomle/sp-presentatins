name: Deploy presentations to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            slides/package-lock.json

      # The local theme in themes/sykehuspartner resolves @slidev/theme-default from the root node_modules
      - name: Install root dependencies
        run: npm ci

      - run: npm ci
        working-directory: slides

      # Required by `slidev export`; playwright-chromium is a devDependency of slides/
      - name: Install Playwright Chromium
        working-directory: slides
        run: npx playwright-core install --with-deps chromium

      - name: Build and export presentations
        working-directory: slides
        env:
          SITE_BASE: /${{ github.event.repository.name }}/
        run: |
          set -euo pipefail
          site="$GITHUB_WORKSPACE/_site"
          exports="$GITHUB_WORKSPACE/exports"
          mkdir -p "$site" "$exports"
          links=""
          for dir in */; do
            name=$(basename "$dir")
            [ -f "$dir/slides.md" ] || continue
            npx slidev build "$dir/slides.md" \
              --base "$SITE_BASE$name/" \
              --out "$site/$name"
            for format in pdf pptx; do
              npx slidev export "$dir/slides.md" \
                --format "$format" \
                --timeout 120000 \
                --output "$site/$name/$name.$format"
              cp "$site/$name/$name.$format" "$exports/"
            done
            title=$(grep -m1 '^title:' "$dir/slides.md" | sed 's/^title:[[:space:]]*//')
            links="$links<li><a href=\"./$name/\">${title:-$name}</a> (<a href=\"./$name/$name.pdf\">PDF</a>, <a href=\"./$name/$name.pptx\">PPTX</a>)</li>"
          done
          cat > "$site/index.html" <<EOF
          <!doctype html>
          <html lang="no">
          <head><meta charset="utf-8"><title>Presentasjoner</title>
          <meta name="viewport" content="width=device-width, initial-scale=1"></head>
          <body style="font-family:system-ui,sans-serif;max-width:720px;margin:4rem auto;padding:0 1rem">
          <h1>Presentasjoner</h1>
          <ul>$links</ul>
          </body>
          </html>
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: presentation-exports
          path: exports/

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
