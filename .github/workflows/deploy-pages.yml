name: Deploy presentations to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build presentations
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p _site
          links=""
          for dir in presentations/*/; do
            name=$(basename "$dir")
            [ -f "$dir/slides.md" ] || continue
            npx slidev build "$dir/slides.md" \
              --base "/$REPO_NAME/$name/" \
              --out "$GITHUB_WORKSPACE/_site/$name"
            title=$(grep -m1 '^title:' "$dir/slides.md" | sed 's/^title:[[:space:]]*//')
            links="$links<li><a href=\"./$name/\">${title:-$name}</a></li>"
          done
          cat > _site/index.html <<EOF
          <!doctype html>
          <html lang="no">
          <head><meta charset="utf-8"><title>Presentasjoner</title>
          <meta name="viewport" content="width=device-width, initial-scale=1"></head>
          <body style="font-family:system-ui,sans-serif;max-width:720px;margin:4rem auto;padding:0 1rem">
          <h1>Presentasjoner</h1>
          <ul>$links</ul>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
